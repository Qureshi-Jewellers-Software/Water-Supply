}

const mods = () => (S.shop && S.shop.modules) || {};

const pin = () => { const s = setting(); return (s && s.data.pin) || ""; };
/* full() = malik, aur PIN laga ho to khula hua. Warna sirf apna kaam nazar ata hai. */
const full = () => isOwner() && (!pin() || S.unlocked);
const mine = r => r.created_by === S.me.id;

async function saveSetting(patch){
  const s = setting();
  if (s){ const d = { ...s.data, ...patch }; await api.upd(s.id, d); s.data = d; }
  else S.recs.push(await api.add(S.shop.id, "setting", today(), patch));
}
function custStats(){
  const m = {};
  const g = id => m[id] || (m[id] = { bal:0, held:0 });
  for (const r of S.recs){
    if (r.kind === "delivery"){ const s = g(r.data.cust); s.bal += num(r.data.amount) - num(r.data.paid); if (r.data.type === "bottle") s.held += num(r.data.qty) - num(r.data.ret); }
    else if (r.kind === "payment") g(r.data.cust).bal -= num(r.data.amount);
  }
  return m;
}
function inPeriod(day){
  const t = today();
  if (S.period === "day") return day === S.rday;
  if (S.period === "d") return day === t;
  if (S.period === "m") return day.slice(0,7) === t.slice(0,7);
  if (S.period === "pm"){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return day.slice(0,7) === dstr(d).slice(0,7); }
  return true;
}

        S.recs = await api.records(S.shop.id);
        if (isOwner()) S.workers = await api.workers(S.shop.id);

}

async function connectPrinter(){

  ${fold("prod", "💧 " + L("Pani kitna bana","Production log"), sumD(mL(pl.filter(r => r.data.t === "prod")), r => r.data.litres).toLocaleString() + " L", prod || none)}

function vHisaab(){
  const m = mods(), N = MODN(), P = [["d",L("Aaj","Today")],["m",L("Is mahine","This month")],["pm",L("Pichla mahina","Last month")],["all",L("Sab","All")],["day",L("Tareekh chunein","Pick a date")]];
  const dl = of("delivery").filter(r => inPeriod(r.day)), ex = of("expense").filter(r => inPeriod(r.day)), sl = of("sale").filter(r => inPeriod(r.day)), py = of("payment").filter(r => inPeriod(r.day)), ho = of("handover").filter(r => inPeriod(r.day));
  const sum = (a, f) => a.reduce((x, r) => x + num(f(r)), 0);
  const inc = { bottle: sum(dl.filter(r => r.data.type === "bottle"), r => r.data.amount), tank: sum(dl.filter(r => r.data.type === "tank"), r => r.data.amount), plant: sum(sl, r => r.data.amount) };
  const exp = { bottle:0, tank:0, plant:0, all:0 }; ex.forEach(r => exp[r.data.mod in exp ? r.data.mod : "all"] += num(r.data.amount));
  const act = ["bottle","tank","plant"].filter(k => m[k]);
  const tInc = act.reduce((x, k) => x + inc[k], 0), tExp = act.reduce((x, k) => x + exp[k], 0) + exp.all, profit = tInc - tExp;
  const cash = sum(dl, r => r.data.paid) + sum(py, r => r.data.amount) + (m.plant ? inc.plant : 0);
  const modRows = act.map(k => `<div class="row"><div class="g"><b>${N[k]}</b><small>${L("Sale","Sales")} ${rs(inc[k])} · ${L("Kharcha","Expense")} ${rs(exp[k])}${k === "tank" ? ` · ${dl.filter(r => r.data.type === "tank").length} ${L("chakkar","trips")} · ${L("bhara","loaded")} ${of("load").filter(r => inPeriod(r.day)).reduce((x, r) => x + num(r.data.litres), 0).toLocaleString()} L · ${L("diya","given")} ${dl.filter(r => r.data.type === "tank").reduce((x, r) => x + num(r.data.qty), 0).toLocaleString()} L` : ""}</small></div><div class="r ${inc[k] - exp[k] < 0 ? "bad" : "good"}">${rs(inc[k] - exp[k])}</div></div>`).join("") +
    (exp.all ? `<div class="row"><div class="g"><b>${L("Mushtarka kharcha","Shared expense")}</b></div><div class="r bad">-${rs(exp.all)}</div></div>` : "");
  /* har banday ka kaam (is muddat mein) aur us par kul baqi cash (shuru se ab tak) */
  const by = {}, g = k => by[k] || (by[k] = { n:0, cash:0, amt:0 });
  dl.forEach(r => { const x = g(r.data.by || "-"); x.n++; x.cash += num(r.data.paid); x.amt += num(r.data.amount); });
  py.forEach(r => { g(r.data.by || "-").cash += num(r.data.amount); });
  const owes = {}, o = (k, v) => owes[k] = (owes[k] || 0) + v;
  of("delivery").forEach(r => o(r.data.by || "-", num(r.data.paid))); of("payment").forEach(r => o(r.data.by || "-", num(r.data.amount))); of("handover").forEach(r => o(r.data.by || "-", -num(r.data.amount)));
  S.workers.forEach(w => g(w.name));
  const me = myName();
  const wr = Object.keys(by).map(k => `<div class="row"><div class="g"><b>${e(k)}</b><small>${by[k].n} ${L("deliveries","deliveries")} · ${L("maal","goods")} ${rs(by[k].amt)} · ${L("wasool","collected")} ${rs(by[k].cash)}${k !== me ? `<br>${L("Us ke paas cash baqi","Cash still with them")}: <b class="${(owes[k] || 0) > 0 ? "bad" : "good"}">${rs(owes[k] || 0)}</b>` : ""}</small></div>
    ${k !== me ? `<button class="btn sm ghost" data-act="handover" data-v="${e(k)}">${L("Cash jama","Cash in")}</button>` : ""}</div>`).join("");
  let stock = "";
  if (m.bottle){
    const st = custStats(), held = of("customer").reduce((x, c) => x + (c.data.type === "bottle" ? ((st[c.id] || {}).held || 0) : 0), 0), total = num((setting() || { data:{} }).data.bottles);

      <div class="row"><div class="g"><b>${L("Kul botalen (aap ki)","Total bottles owned")}</b></div><div class="r">${total || "?"}</div><button class="btn sm ghost" data-act="stock">${L("Badlein","Edit")}</button></div>
      <div class="row"><div class="g"><b>${L("Grahakon ke paas","With customers")}</b></div><div class="r">${held}</div></div>
      ${total ? `<div class="row"><div class="g"><b>${L("Godaam / gaari mein","In store / vehicle")}</b></div><div class="r ${total - held < 0 ? "bad" : "good"}">${total - held}</div></div>` : ""}</div>`;
  }
  let dayCard = "";
  if (S.period === "day"){
    const rows = dl.slice().reverse().map(r => rowDelivery(r, true)).join("") + py.map(r => rowPay(r, true)).join("") + ex.map(rowExp).join("") +
      ho.map(r => `<div class="row"><div class="g"><b>${e(r.data.by)}</b><small>${L("Cash jama karaya","Cash handed in")}</small></div><div class="r good">${rs(r.data.amount)}</div><button class="btn sm danger" data-act="del" data-id="${r.id}" aria-label="Delete">✕</button></div>`).join("");
    dayCard = `<div class="card"><h2>${nice(S.rday)} ${L("ki entries","entries")}</h2>${rows || `<p class="mute">${L("Is din koi entry nahi.","No entries on this day.")}</p>`}</div>`;
  }
  return `<div class="seg">${P.map(p => `<button class="${S.period === p[0] ? "on" : ""}" data-act="period" data-v="${p[0]}">${p[1]}</button>`).join("")}</div>
  ${S.period === "day" ? `<div><label for="rday">${L("Kis din ka record dekhna hai","Which day's record")}</label><input id="rday" type="date" value="${S.rday}" max="${today()}"></div>` : ""}
  <div class="tiles"><div class="tile"><b>${rs(tInc)}</b><span>${L("Kul Sale","Total sales")}</span></div><div class="tile bad"><b>${rs(tExp)}</b><span>${L("Kul kharcha","Total expense")}</span></div>

  ${supply() ? `<div class="card"><h2>${L("Kis ne kitna kaam kiya","Work by staff")}</h2>${wr || `<p class="mute">${L("Is muddat mein koi delivery nahi.","No deliveries in this period.")}</p>`}</div>` : ""}
  ${stock}
  ${supply() ? `<button class="btn wide ghost" data-act="goDue">${L("Udhaar khata dekhein","Open credit ledger")}</button>` : ""}`;
}

function bkInfo(){
  const s = (setting() || { data:{} }).data, every = s.bkEvery || "w", last = s.bkLast || "";
  const gap = { d:1, w:7, m:30 }[every] || 7, days = last ? Math.floor((new Date(today()) - new Date(last)) / 864e5) : -1;
  return { every, last, days, due: days < 0 || days >= gap };
}

const forms = {
  login: async o => { await api.login(o.email.trim(), o.pw); await boot(); },
  fees: async (o, f) => {
    const s = S.admin.shops.find(x => x.id === f.dataset.id), b = JSON.parse(JSON.stringify(s.billing || {}));
    b.fee = +o.fee || 0; b.paid = b.paid || {};
    if (o.month){ if (+o.amt > 0) b.paid[o.month] = { amt:+o.amt, day:today() }; else delete b.paid[o.month]; }
    await api.updateShop(s.id, { billing:b }); s.billing = b; closeSheet(); render(); toast(L("Mehfooz ho gaya","Saved"));
  },
  newShop: async o => {
    const modules = { bottle: !!o.m_bottle, tank: !!o.m_tank, plant: !!o.m_plant };
    if (!modules.bottle && !modules.tank && !modules.plant) throw new Error(L("Kam az kam ek kaam chunein","Choose at least one type of work"));
    await api.createShop({ name:o.name.trim(), owner:o.owner.trim(), phone:o.phone.trim(), email:o.email.trim(), pw:o.pw, modules });
    S.admin = await api.shops(); closeSheet(); render(); toast(L("Client ban gaya","Client created"));
  },
  cust: async (o, f) => {
    const data = { name:o.name.trim(), phone:o.phone.trim(), addr:o.addr.trim(), type:o.type, rate:num(o.rate), deposit:num(o.deposit), days:[0,1,2,3,4,5,6].filter(i => o["day" + i]) };
    const id = f.dataset.id;
    if (id){ await api.upd(id, data); cust(id).data = data; closeSheet(); render(); sCust(id); }
    else { S.recs.push(await api.add(S.shop.id, "customer", today(), data)); closeSheet(); render(); }
    toast(L("Mehfooz ho gaya","Saved"));
  },
  deliver: async (o, f) => {
    if (o.doprint && navigator.bluetooth && !f.dataset.rid){
      try { toast(L("Printer se jur raha hai...","Connecting to printer...")); await connectPrinter(); }
      catch(err){ btChar = null; o.doprint = ""; o.printFail = printErr(err); }
    }
    const c = cust(f.dataset.id), qty = num(o.qty), rate = num(o.rate), old = f.dataset.rid ? S.recs.find(r => r.id === f.dataset.rid) : null;
    if (c.data.type === "tank" && !old){ const lz = loadStats(o.day || today()); if (lz.loaded && qty > lz.left && f.dataset.okl !== String(qty)){ f.dataset.okl = String(qty); throw new Error(L(`Suzuki mein aaj sirf ${lz.left.toLocaleString()} litre bacha hai, aap ne ${qty.toLocaleString()} likha hai. Sahi hai to dobara dabayein.`, `Only ${lz.left.toLocaleString()} L left in the Suzuki today, you entered ${qty.toLocaleString()}. Tap again if correct.`)); } }
    if (qty <= 0) throw new Error(L("Miqdaar likhein","Enter a quantity"));
    const prev = (custStats()[c.id] || { bal:0 }).bal - (old ? num(old.data.amount) - num(old.data.paid) : 0);
    const most = qty * rate + Math.max(0, prev), pd = num(o.paid);
    if (pd > most && f.dataset.ok !== String(pd)){ f.dataset.ok = String(pd); throw new Error(L(`Naqd ${rs(pd)} likha hai, jab ke bill aur purana baqaya mila kar ${rs(most)} banta hai. Ghalti hai to theek karein, sahi hai to dobara dabayein.`, `Cash ${rs(pd)} is more than bill plus old balance (${rs(most)}). Fix it, or tap again if correct.`)); }
    const data = { cust:c.id, type:c.data.type, qty, ret:num(o.ret), rate, amount:qty * rate, paid:pd, by: old ? old.data.by : myName() };
    if (old){ data.edited = { by:myName(), at:new Date().toISOString() }; const day = o.day || old.day; await api.upd(old.id, data, day); old.data = data; old.day = day; closeSheet(); render(); toast(L("Tabdeeli mehfooz ho gayi","Changes saved")); return; }
    const nr = await api.add(S.shop.id, "delivery", o.day || today(), data); S.recs.push(nr);
    for (const od of of("order").filter(r => r.data.cust === c.id && r.data.status === "new")){ try { const dd = { ...od.data, status:"done", by:myName() }; await api.upd(od.id, dd); od.data = dd; } catch(_){} }
    closeSheet(); render(); toast(L("Delivery likh di","Delivery saved"));
    const cv = slipDelivery(nr); let note = "";
    if (o.printFail) note = L("Delivery save ho gayi, lekin print nahi hua: ","Saved, but not printed: ") + o.printFail;
    if (o.doprint){ try { await printCV(cv); } catch(err){ note = L("Delivery save ho gayi, lekin print nahi hua: ","Saved, but not printed: ") + err.message; } }
    if (o.doprint || o.dowa || note) showSlip(cv, L("Raseed","Receipt") + ": " + c.data.name, o.doprint && !note, note, nr, !!o.dowa);
  },
  pay: async (o, f) => {
    if (num(o.amount) <= 0) throw new Error(L("Raqam likhein","Enter an amount"));
    const old = f.dataset.rid ? S.recs.find(r => r.id === f.dataset.rid) : null;
    const due = Math.max(0, (custStats()[f.dataset.id] || { bal:0 }).bal + (old ? num(old.data.amount) : 0)), am = num(o.amount);
    if (am > due && f.dataset.ok !== String(am)){ f.dataset.ok = String(am); throw new Error(L(`Raqam ${rs(am)} likhi hai, jab ke baqaya sirf ${rs(due)} hai. Ghalti hai to theek karein, sahi hai to dobara dabayein.`, `Amount ${rs(am)} is more than the balance due (${rs(due)}). Fix it, or tap again if correct.`)); }
    if (old){ const data = { ...old.data, amount:am, edited:{ by:myName(), at:new Date().toISOString() } }, day = o.day || old.day; await api.upd(old.id, data, day); old.data = data; old.day = day; closeSheet(); render(); toast(L("Tabdeeli mehfooz ho gayi","Changes saved")); return; }
    S.recs.push(await api.add(S.shop.id, "payment", o.day || today(), { cust:f.dataset.id, amount:am, by:myName() }));
    closeSheet(); render(); sCust(f.dataset.id); toast(L("Wasooli likh di","Payment saved"));
  },
  exp: async (o, f) => {
    const old = f.dataset.rid ? S.recs.find(r => r.id === f.dataset.rid) : null, data = { cat:o.cat, amount:num(o.amount), mod:o.mod, note:o.note.trim() };
    if (old){ data.edited = { by:myName(), at:new Date().toISOString() }; const day = o.day || old.day; await api.upd(old.id, data, day); old.data = data; old.day = day; }
    else S.recs.push(await api.add(S.shop.id, "expense", o.day || today(), data));
    closeSheet(); render(); toast(L("Kharcha likh diya","Expense saved"));
  },
  hand: async (o, f) => { if (num(o.amount) <= 0) throw new Error(L("Raqam likhein","Enter an amount")); S.recs.push(await api.add(S.shop.id, "handover", o.day || today(), { by:f.dataset.v, amount:num(o.amount) })); closeSheet(); render(); toast(L("Cash jama likh diya","Cash-in saved")); },
  stock: async o => { await saveSetting({ bottles:num(o.bottles) }); closeSheet(); render(); toast(L("Mehfooz ho gaya","Saved")); },
  shopinfo: async o => { await saveSetting({ phone:o.phone.trim(), addr:o.addr.trim(), addr2:o.addr2.trim() }); closeSheet(); render(); toast(L("Mehfooz ho gaya","Saved")); },
  pin: async (o, f) => {
    if (!/^[0-9]{4,8}$/.test(o.pin)) throw new Error(L("PIN sirf hindson mein likhein (kam az kam 4)","PIN must be digits only (at least 4)"));
    if (f.dataset.mode === "set"){ await saveSetting({ pin:o.pin }); S.unlocked = true; closeSheet(); render(); toast(L("PIN lag gaya","PIN set")); }
    else if (o.pin === pin()){ S.unlocked = true; closeSheet(); render(); toast(L("Khul gaya","Unlocked")); }
    else throw new Error(L("PIN ghalat hai","Wrong PIN"));
  },
  prod: async o => { S.recs.push(await api.add(S.shop.id, "plant", o.day || today(), { t:"prod", litres:num(o.litres), bottles:num(o.bottles) })); closeSheet(); render(); toast(L("Likh diya","Saved")); },
  load: async (o, f) => {
    if (num(o.litres) <= 0) throw new Error(L("Litre likhein","Enter litres"));
    const old = f.dataset.rid ? S.recs.find(r => r.id === f.dataset.rid) : null, data = { litres:num(o.litres), by: old ? old.data.by : myName(), src: mods().plant ? "plant" : "" };
    if (old){ await api.upd(old.id, data, o.day || old.day); old.data = data; old.day = o.day || old.day; }
    else S.recs.push(await api.add(S.shop.id, "load", o.day || today(), data));
    closeSheet(); render(); toast(L("Suzuki ka record likh diya","Suzuki load saved"));
  },
  sale: async o => { S.recs.push(await api.add(S.shop.id, "sale", o.day || today(), { qty:num(o.qty), amount:num(o.amount), note:"" })); closeSheet(); render(); toast(L("Likh diya","Saved")); },
  worker: async o => { await api.createWorker(S.shop.id, { name:o.name.trim(), email:o.email.trim(), pw:o.pw }); S.workers = await api.workers(S.shop.id); closeSheet(); render(); sheet(L("Delivery walay ladkay","Delivery staff"), staffHtml()); toast(L("Login ban gaya","Login created")); }
};
let busy = false;
document.addEventListener("click", async ev => {
  if (Date.now() < lockUntil) return;
  const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "INPUT") return;
  const fn = acts[el.dataset.act]; if (!fn) return;
  try { await fn(el, ev); } catch(err){ toast(err.message || String(err)); }
});
document.addEventListener("change", async ev => {
  const el = ev.target;
  if (el.id === "rday"){ S.rday = el.value || today(); render(); return; }
if (el.dataset && el.dataset.act === "mod"){ try { await acts.mod(el); } catch(err){ el.checked = !el.checked; toast(err.message || String(err)); } }
});
document.addEventListener("submit", async ev => {
  const f = ev.target.closest("form[data-form]"); if (!f) return; ev.preventDefault(); if (busy) return;
  const sub = ev.submitter, o = Object.fromEntries(new FormData(f).entries()), btn = sub || f.querySelector("button:not([type=button])");
  if (sub && sub.dataset.print) o.doprint = "1";
  if (sub && sub.dataset.wa) o.dowa = "1";
  const old = btn ? btn.textContent : "";
  busy = true; if (btn){ btn.disabled = true; btn.textContent = L("Ruk jayein, ho raha hai...","Please wait..."); }
  try { await forms[f.dataset.form](o, f); } catch(err){ toast(err.message || String(err)); }
  busy = false; if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = old; }
});
/* har lafz ka pehla harf capital (naam, pata, note waghera) */
function capOk(el){
  if (!el || !["INPUT","TEXTAREA"].includes(el.tagName) || el.readOnly) return false;
  const t = el.tagName === "TEXTAREA" ? "text" : (el.getAttribute("type") || "text").toLowerCase(), im = (el.getAttribute("inputmode") || "").toLowerCase();
  return ["text","search"].includes(t) && !["numeric","decimal","tel","email","url"].includes(im) && el.id !== "olurl" && !["pw","pin","email"].includes(el.name) && !el.closest(".pw");
}
document.addEventListener("focusin", ev => { if (capOk(ev.target)) ev.target.setAttribute("autocapitalize", "words"); });
function searchTop(el){ const hd = document.querySelector("header"), y = el.getBoundingClientRect().top + window.scrollY - (hd ? hd.offsetHeight : 0) - 8; window.scrollTo(0, Math.max(0, y)); }
document.addEventListener("focusin", ev => { const el = ev.target; if (el && ["q","aq","pq"].includes(el.id)) setTimeout(() => searchTop(el), 250); });
document.addEventListener("input", ev => {
  const el = ev.target;
  if (capOk(el)){ const v = el.value, nv = v.replace(/(^|\s)(\p{Ll})/gu, (m, s, c) => s + c.toUpperCase()); if (nv !== v){ const pos = el.selectionStart; el.value = nv; try { el.setSelectionRange(pos, pos); } catch(_){} } }
  if (el.id === "q"){ S.q = el.value; searchTop(el); const tmp = document.createElement("div"); tmp.innerHTML = vCust(); const cl = tmp.querySelector("#custList"); if (cl && $("#custList")) $("#custList").innerHTML = cl.innerHTML; }
  else if (el.id === "aq"){ S.aq = el.value; const tmp = document.createElement("div"); tmp.innerHTML = vAdmin(); $("#aList").innerHTML = tmp.querySelector("#aList").innerHTML; }
  else if (el.id === "pq") $("#pickList").innerHTML = pickRows(el.value);
  else if (el.form && el.form.dataset.form === "deliver" && (el.name === "qty" || el.name === "rate" || el.name === "paid")){ const b = num(el.form.qty.value) * num(el.form.rate.value); $("#dv_amt").textContent = rs(b); $("#dv_tot").textContent = rs(Math.max(0, b + num(el.form.dataset.prev))); dvAfter(el.form); }
});

/* ================= grahak ka order page (?o=...) ================= */
const ORDER_TOK = (() => { try { return new URLSearchParams(location.search).get("o") || ""; } catch(_){ return ""; } })();
const P = { data:null, err:"", sent:false, loading:true };
async function loadPortal(){
  P.loading = true; renderPortal();
  try { P.data = await api.portal(ORDER_TOK); P.err = P.data ? "" : "link"; } catch(_){ P.err = "net"; }
  P.loading = false; renderPortal();
}
function renderPortal(){
  const app = $("#app"), banner = DEMO ? `<div class="demo">${L("DEMO: yeh sirf namoona hai, data save nahi hota","DEMO: sample only, nothing is saved")}</div>` : "";
  const langBtn = `<button class="hbtn" data-act="lang">🌐</button>`;
  const d = P.data;
  if (P.loading && !d){ app.innerHTML = banner + `<main><p class="mute">${L("Khul raha hai...","Loading...")}</p></main>`; return; }
  if (!d){
    app.innerHTML = banner + `<header><h1>Paani Supply</h1>${langBtn}</header><main><div class="card"><h2>${P.err === "net" ? L("Internet ka masla","Connection problem") : L("Yeh link nahi chal raha","This link does not work")}</h2><p class="mute">${P.err === "net" ? L("Internet check kar ke page dobara kholein.","Check your internet and open the page again.") : L("Apni paani supply wale se naya link mangwa lein.","Please ask your water supplier for a new link.")}</p></div></main>`;
    return;
  }
  const tank = d.type === "tank", step = tank ? 100 : 1, def = tank ? 500 : 1;
  const pend = (d.orders || []).map(o => `<div class="row"><div class="g"><b>${num(o.qty).toLocaleString()} ${tank ? L("litre","litres") : L("botal","bottles")}</b><small>${L("Bheja","Sent")} ${ago(o.at)}${o.note ? " · " + e(o.note) : ""}</small></div><span class="pill warn">${L("Raaste mein","On the way")}</span></div>`).join("");
  app.innerHTML = banner + `<header><h1>${e(d.shop)}<small>${L("Paani mangwayein","Order water")}</small></h1>${langBtn}</header>
  <main>
    <div class="card"><h2>${L("Assalam o alaikum","Hello")}, ${e(d.name)}</h2>
      <div class="tiles"><div class="tile"><b>${rs(d.bal)}</b><span>${num(d.bal) > 0 ? L("Aap ka baqaya","Your balance due") : L("Baqaya","Balance")}</span></div>
      ${tank ? `<div class="tile"><b>${rs(d.rate)}</b><span>${L("Rate fi litre","Rate per litre")}</span></div>` : `<div class="tile"><b>${num(d.held)}</b><span>${L("Hamari botalen aap ke paas","Our bottles with you")}</span></div>`}</div></div>
    ${P.sent ? `<div class="card" style="border:2px solid var(--good)"><h2 class="good">✔ ${L("Order chala gaya","Order sent")}</h2><p class="mute" style="margin:0">${L("Shukriya! Hamara banda jald pohanch jayega.","Thank you! We will deliver soon.")}</p></div>` : ""}
    <form class="card f" data-form="porder">
      <h2>${tank ? L("Kitne litre chahiye?","How many litres?") : L("Kitni botal chahiye?","How many bottles?")}</h2>
      <div style="display:flex;gap:10px;align-items:center">
        <button type="button" class="btn ghost" data-act="pq" data-v="-" aria-label="Kam" style="width:64px">−</button>
        <input id="pq_q" name="qty" inputmode="numeric" value="${def}" data-step="${step}" aria-label="Qty" style="text-align:center;font-size:30px;font-weight:800">
        <button type="button" class="btn ghost" data-act="pq" data-v="+" aria-label="Zyada" style="width:64px">+</button>
      </div>
      ${!tank && num(d.rate) ? `<p class="mute" style="margin:0">${L("Rate","Rate")}: ${rs(d.rate)} ${L("fi botal","per bottle")}</p>` : ""}
      <div><label for="pq_n">${L("Kuch kehna ho (zaroori nahi)","Note (optional)")}</label><input id="pq_n" name="note" maxlength="200" placeholder="${L("Maslan: shaam 5 baje ke baad","e.g. after 5 pm")}"></div>
      <button class="btn wide">📲 ${L("Order bhejein","Send order")}</button>
    </form>
    ${pend ? `<div class="card"><h2>${L("Aap ke order","Your orders")}</h2>${pend}</div>` : ""}
    ${d.phone ? `<div class="card f"><h2>${L("Rabta","Contact")}</h2><div style="font-size:24px;font-weight:800">${e(d.phone)}</div>
      <div class="acts"><a class="btn sm ghost" href="tel:${e(d.phone)}">📞 ${L("Call","Call")}</a><a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${waNum(d.phone)}">WhatsApp</a></div></div>` : ""}
  </main>`;
}
forms.porder = async o => {
  const q = num(o.qty); if (q <= 0) throw new Error(L("Tadaad likhein","Enter a quantity"));
  const r = await api.placeOrder(ORDER_TOK, q, String(o.note || "").trim());
  if (!r || !r.ok){
    const m = { many:L("Aap ke 3 order pehle se raaste mein hain. Thora intezar karein.","You already have 3 open orders. Please wait."), qty:L("Tadaad theek likhein","Enter a valid quantity") }[r && r.err] || L("Yeh link nahi chal raha. Naya link mangwa lein.","This link does not work. Ask for a new one.");
    throw new Error(m);
  }
  P.sent = true; await loadPortal(); window.scrollTo(0, 0);
};

/* malik / ladka: naye order har 45 second baad dekho */
let orderPoll = null;
function startOrderPoll(){
  if (orderPoll || DEMO) return;
  orderPoll = setInterval(async () => {
    if (!S.shop || !supply() || document.visibilityState !== "visible") return;
    try {
      const fresh = await api.openOrders(S.shop.id), had = new Set(of("order").map(r => r.id));
      S.recs = S.recs.filter(r => !(r.kind === "order" && r.data.status === "new")).concat(fresh);
      const neu = fresh.filter(r => !had.has(r.id));
      if (neu.length){ const c = cust(neu[0].data.cust); toast("📲 " + L("Naya order","New order") + ": " + (c ? c.data.name : "") + " · " + num(neu[0].data.qty)); if (!$("#sheet").innerHTML && S.tab === "aaj") render(); }
    } catch(_){}
  }, 45000);
}

/* mobile ka Back: pehle form band, phir "Aaj", phir do dafa dabane par app band */
function armBack(){ try { if (!(history.state && history.state.ps)) history.pushState({ ps:1 }, ""); } catch(_){} }
let lastBack = 0;
window.addEventListener("popstate", () => {
  if (ORDER_TOK || !S.me) return;
  if ($("#sheet").innerHTML){ $("#sheet").innerHTML = ""; armBack(); return; }
  if (S.tab !== "aaj"){ S.tab = "aaj"; render(); window.scrollTo(0, 0); armBack(); return; }
  const now = Date.now();
  if (now - lastBack < 2000){ history.back(); return; }
  lastBack = now; toast(L("Band karne ke liye dobara Back dabayein","Press Back again to exit")); armBack();
});
